<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDC KPRCAS | Blog Series</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    #modal {
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

<div class="container mx-auto px-4 py-10">
  <!-- Header -->
  <header class="text-center mb-12">
    <h1 class="text-4xl font-bold text-gray-900">EDC KPRCAS</h1>
    <p class="text-lg text-gray-500 mt-1">The Founder's Journey</p>
  </header>

  <!-- Blog Cards Grid -->
  <div id="blog-cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <!-- Blog cards will be dynamically inserted here -->
  </div>

  <footer class="mt-12 pt-6 border-t border-gray-200 text-center text-sm text-gray-500">
    &copy; 2025 EDC KPRCAS. All Rights Reserved.
  </footer>
</div>

<!-- Modal for Blog Content -->
<div id="modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 z-50 hidden">
  <div class="bg-white rounded-lg max-w-3xl w-full max-h-[90vh] overflow-y-auto p-8 relative" id="modal-content">
    <button id="close-modal-btn" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
    <h1 id="modal-title" class="text-4xl font-bold mb-2 text-gray-900"></h1>
    <p id="modal-date" class="text-md text-gray-500 mb-6"></p>
    <div id="modal-body" class="prose max-w-none prose-lg prose-indigo"></div>
  </div>
</div>


<script>
  const blogPosts = [
    {
      title: "Week 1: Vision and Foundation",
      date: "August 15, 2025",
      summary: "Discover how the EDC serves as a transformative platform to shape the futures of students.",
      content: `
                    <p class="mb-6 text-gray-600">The Entrepreneurship Development Cell (EDC) is not just another college club—it is a transformative platform designed to shape the futures of students by empowering them with the entrepreneurial mindset and skills vital for success in the rapidly evolving business landscape.</p>
                    <h2 class="text-2xl font-semibold mb-4 text-gray-800">EDC: Vision and Foundation</h2>
                    <p class="mb-4 text-gray-600">An EDC functions as a dedicated unit within academic institutions to ignite innovation, foster creativity, and encourage ambitious students to pursue entrepreneurship as a viable career path. Unlike traditional clubs that revolve around hobbies or interest-based activities, EDCs play a crucial role in bridging the gap between classroom theory and real-world industry practices. Through mentorship, hands-on learning, workshops, and interaction with successful entrepreneurs, students get much more than theoretical knowledge—they experience the complete journey from idea conception to venture creation.</p>
                    <h2 class="text-2xl font-semibold mb-4 text-gray-800">No Club—Your Future Platform</h2>
                    <p class="mb-4 text-gray-600">EDCs nurture entrepreneurial skills through a range of activities: startup mentorship, pitch competitions, incubation support, guest lectures, and skill-building workshops.</p>
                `
    },
    {
      title: "Week 2: From Job Seeker to Job Creator",
      date: "August 22, 2025",
      summary: "Learn about the EDC's key role in transforming job seekers into visionary job creators.",
      content: `
                    <p class="mb-6 text-gray-600">The key role of the Entrepreneurship Development Cell (EDC) lies in transforming job seekers into job creators, changing how students view their career potential and ambitions during college.</p>
                    <h2 class="text-2xl font-semibold mb-4 text-gray-800">EDC: Shifting Mindset from Employment to Empowerment</h2>
                    <p class="mb-4 text-gray-600">An EDC acts as a catalyst within academic institutions, encouraging students to move beyond the traditional path of job hunting and embrace entrepreneurship as a viable alternative. Through targeted programs, seminars, and interactive sessions, EDCs expose students to the realities and opportunities in the world of startups and self-employment.</p>
                `
    },
    {
      title: "Week 3: Cultivating Studentpreneurs",
      date: "August 29, 2025",
      summary: "Explore how the EDC fosters studentpreneurs, turning campuses into hubs of innovation.",
      content: `
                    <p class="mb-6 text-gray-600">The Entrepreneurship Development Cell (EDC) plays a pivotal role in fostering studentpreneurs within college, turning campuses into vibrant hubs of innovation and entrepreneurial action.</p>
                    <h2 class="text-2xl font-semibold mb-4 text-gray-800">EDC: Cultivating Student Entrepreneurship</h2>
                    <p class="mb-4 text-gray-600">EDCs create an empowering environment where students are encouraged to pursue their entrepreneurial ideas—helping them move from concept to execution with structured support. Students are motivated to experiment, take calculated risks, and learn real-world business skills within the safety net of the campus.</p>
                `
    },
    {
      title: "Week 4: Impact on Business Development",
      date: "September 5, 2025",
      summary: "Understand the EDC's significant impact on business development and early-stage startups.",
      content: `
                    <p class="mb-6 text-gray-600">The Entrepreneurship Development Cell (EDC) has a significant impact on business development by nurturing new ideas, supporting early-stage startups, and bridging the gap between academic learning and market reality.</p>
                    <h2 class="text-2xl font-semibold mb-4 text-gray-800">EDC: Stimulating Innovation and Opportunity</h2>
                    <p class="mb-4 text-gray-600">EDCs foster an entrepreneurial ecosystem where students are encouraged to innovate, experiment, and find real-world solutions to pressing issues. Through regular workshops, seminars, and mentorship, the cell provides students with exposure to current market trends, customer needs, and new business models—core elements for successful business development.</p>
                `
    },
    {
      title: "Week 5: The Evolution from Club to Cell",
      date: "September 12, 2025",
      summary: "Trace the growth of the EDC from an informal club to a structured, institutional cell.",
      content: `
                    <p class="mb-6 text-gray-600">The growth of the Entrepreneurship Development Cell (EDC) from a club to a cell marks a significant evolution from informal gatherings focused on interest in entrepreneurship to a structured, resourceful unit with a larger institutional role.</p>
                    <h2 class="text-2xl font-semibold mb-4 text-gray-800">Transformation: Club to Strategic Cell</h2>
                    <p class="mb-4 text-gray-600">Originally, EDCs often started as small student clubs aiming to build awareness around entrepreneurship. As interest and institutional support grew, these entities transformed into formal cells—complete with dedicated staff, resources, incubation facilities, curriculum integration, and official recognition within colleges and universities.</p>
                `
    },
    {
      title: "Week 6: A Launchpad for Ventures",
      date: "September 19, 2025",
      summary: "See how the EDC provides a complete ecosystem to launch student business ventures.",
      content: `
                    <p class="mb-6 text-gray-600">The Entrepreneurship Development Cell (EDC) serves as a launchpad for student business ventures by providing a comprehensive ecosystem of support, resources, and guidance from ideation to market entry.</p>
                    <h2 class="text-2xl font-semibold mb-4 text-gray-800">EDC Launchpad Functions</h2>
                    <p class="mb-4 text-gray-600">EDCs guide aspiring entrepreneurs through every stage of the startup journey. Through mentoring, training programs, skill development workshops, and idea incubation, the cell helps students refine and validate their business concepts. Expert mentors and industry leaders routinely engage with students to offer personalized feedback and strategic direction.</p>
                `
    },
    {
      title: "Week 7: Gateway to the Startup Ecosystem",
      date: "September 26, 2025",
      summary: "Learn how the EDC connects students with the modern and sustainable startup world.",
      content: `
                    <p class="mb-6 text-gray-600">The Entrepreneurship Development Cell (EDC) functions as a gateway to the modern and sustainable startup ecosystem by connecting students with emerging trends, best practices, and networks essential for building future-ready ventures.</p>
                    <h2 class="text-2xl font-semibold mb-4 text-gray-800">Bridging Campuses and the Startup World</h2>
                    <p class="mb-4 text-gray-600">EDCs introduce students to the dynamic world of contemporary entrepreneurship, emphasizing innovation, technology adoption, and sustainable business models. Through interactions with successful founders, industry mentors, and ecosystem partners, the cell helps students absorb startup culture and global business standards.</p>
                `
    },
    {
      title: "Week 8: From Pitching to Profit",
      date: "October 3, 2025",
      summary: "Follow the journey from pitching an idea to growing it into a profitable initiative with EDC's help.",
      content: `
                    <p class="mb-6 text-gray-600">The Entrepreneurship Development Cell (EDC) plays a direct role in guiding students through the crucial stages from pitching an idea to growing it into a profitable initiative.</p>
                    <h2 class="text-2xl font-semibold mb-4 text-gray-800">Pitching to Profit: The EDC Process</h2>
                    <p class="mb-4 text-gray-600">EDCs create platforms where students learn to craft, refine, and pitch their business ideas—often through events like pitch competitions, hackathons, and demo days. Feedback from industry experts and mentors helps students shape ideas into actionable business models with clear value propositions.</p>
                `
    },
    {
      title: "Week 9: Why Your College Needs an EDC",
      date: "October 10, 2025",
      summary: "Understand the critical gap an EDC fills that a traditional academic curriculum cannot.",
      content: `
                    <p class="mb-6 text-gray-600">A college needs an Entrepreneurship Development Cell (EDC) because it transforms the campus into a proving ground for innovation, self-employment, and economic leadership. The EDC fills a critical gap that a traditional academic curriculum alone cannot address—by offering a launchpad for entrepreneurial talent that directly impacts students, faculty, and the broader community.</p>
                    <h2 class="text-2xl font-semibold mb-4 text-gray-800">Bridging Education and Real-World Opportunity</h2>
                    <p class="mb-4 text-gray-600">An EDC integrates entrepreneurial thinking with academic learning, making education not just about acquiring knowledge but about cultivating skills and mindsets to solve real-world problems. Through workshops, business plan competitions, mentoring, and industry partnerships, EDCs provide students with exposure to the realities of starting and running a business—helping them move from textbook theories to actionable ventures.</p>
                `
    },
    {
      title: "Week 10: Kickstart Your Career",
      date: "October 17, 2025",
      summary: "Discover how the EDC acts as the ultimate bridge between academic life and professional opportunities.",
      content: `
                    <p class="mb-6 text-gray-600">The Entrepreneurship Development Cell (EDC) kickstarts a student’s career to the next level by acting as the ultimate bridge between academic life and the world of professional opportunities. It provides a structured environment not just for learning about entrepreneurship in theory, but also for gaining real, transformative experience that benefits every aspect of a student’s future career, whether as an entrepreneur or in the corporate world.</p>
                    <h2 class="text-2xl font-semibold mb-4 text-gray-800">Experiential Learning and Real-World Preparation</h2>
                    <p class="mb-4 text-gray-600">EDCs expose students to every stage of the entrepreneurial journey—from ideation and market research to business plan development, fundraising, prototyping, and scaling. Students participate in hands-on activities such as startup bootcamps, pitch competitions, and hackathons where their ideas are tested and refined in real-time. Working on projects under the guidance of seasoned entrepreneurs and mentors, students learn how to navigate uncertainty, adapt to feedback, and focus on value creation—essential qualities for any fast-moving industry.</p>
                `
    }
  ];

  const cardsContainer = document.getElementById('blog-cards-grid');
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modal-title');
  const modalDate = document.getElementById('modal-date');
  const modalBody = document.getElementById('modal-body');
  const closeModalBtn = document.getElementById('close-modal-btn');

  const today = new Date('2025-10-09T12:00:00'); // Fixed date for consistent behavior

  function openModal(index) {
    const post = blogPosts[index];
    modalTitle.textContent = post.title;
    modalDate.textContent = `Published on ${post.date}`;
    modalBody.innerHTML = post.content;
    modal.classList.remove('hidden');
  }

  function closeModal() {
    modal.classList.add('hidden');
  }

  closeModalBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      closeModal();
    }
  });

  blogPosts.forEach((post, index) => {
    const postDate = new Date(post.date);
    const isUpcoming = postDate.setHours(0,0,0,0) > today.setHours(0,0,0,0);

    const card = document.createElement('div');
    card.className = `bg-gray-900 text-white rounded-xl p-8 flex flex-col h-full`;

    let cardContent = `
                <div class="flex-grow">
                    <h3 class="text-2xl font-bold">${post.title}</h3>
                    <p class="text-gray-400 mt-2 text-sm">${post.summary}</p>
                </div>
            `;

    if (isUpcoming) {
      card.classList.add('opacity-50', 'cursor-not-allowed');
      cardContent += `<span class="mt-6 self-end font-semibold text-yellow-400">Coming Soon</span>`;
    } else {
      card.classList.add('hover:scale-105', 'transition-transform', 'duration-300', 'cursor-pointer');
      cardContent += `<span class="mt-6 self-end font-semibold text-white">read now &rarr;</span>`;
      card.addEventListener('click', () => openModal(index));
    }

    card.innerHTML = cardContent;
    cardsContainer.appendChild(card);
  });

</script>
</body>
</html>
