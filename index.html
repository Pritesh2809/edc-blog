<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDC KPRCAS | Blog Series</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="container mx-auto px-4 py-10">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-900">EDC KPRCAS</h1>
            <p class="text-lg text-gray-500 mt-1">The Founder's Journey</p>
        </header>
        
        <!-- Blog Cards Grid -->
        <div id="blog-cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Blog cards will be dynamically inserted here -->
        </div>

         <footer class="mt-12 pt-6 border-t border-gray-200 text-center text-sm text-gray-500">
            &copy; 2025 EDC KPRCAS. All Rights Reserved.
        </footer>
    </div>

    <script>
        const blogPosts = [
            {
                title: "Week 1: Vision and Foundation",
                date: "August 15, 2025",
                summary: "Discover how the EDC serves as a transformative platform to shape the futures of students."
            },
            {
                title: "Week 2: From Job Seeker to Job Creator",
                date: "August 22, 2025",
                summary: "Learn about the EDC's key role in transforming job seekers into visionary job creators."
            },
            {
                title: "Week 3: Cultivating Studentpreneurs",
                date: "August 29, 2025",
                summary: "Explore how the EDC fosters studentpreneurs, turning campuses into hubs of innovation."
            },
            {
                title: "Week 4: Impact on Business Development",
                date: "September 5, 2025",
                summary: "Understand the EDC's significant impact on business development and early-stage startups."
            },
            {
                title: "Week 5: The Evolution from Club to Cell",
                date: "September 12, 2025",
                summary: "Trace the growth of the EDC from an informal club to a structured, institutional cell."
            },
            {
                title: "Week 6: A Launchpad for Ventures",
                date: "September 19, 2025",
                summary: "See how the EDC provides a complete ecosystem to launch student business ventures."
            },
            {
                title: "Week 7: Gateway to the Startup Ecosystem",
                date: "September 26, 2025",
                summary: "Learn how the EDC connects students with the modern and sustainable startup world."
            },
            {
                title: "Week 8: From Pitching to Profit",
                date: "October 3, 2025",
                summary: "Follow the journey from pitching an idea to growing it into a profitable initiative with EDC's help."
            },
            {
                title: "Week 9: Why Your College Needs an EDC",
                date: "October 10, 2025",
                summary: "Understand the critical gap an EDC fills that a traditional academic curriculum cannot."
            },
            {
                title: "Week 10: Kickstart Your Career",
                date: "October 17, 2025",
                summary: "Discover how the EDC acts as the ultimate bridge between academic life and professional opportunities."
            }
        ];

        const cardsContainer = document.getElementById('blog-cards-grid');
        const today = new Date('2025-10-09T12:00:00'); // Fixed date for consistent behavior

        blogPosts.forEach((post, index) => {
            const postDate = new Date(post.date);
            const isUpcoming = postDate.setHours(0,0,0,0) > today.setHours(0,0,0,0);
            
            const weekNumber = index + 1;
            let cardElement;

            // Common content for both upcoming and published cards
            const cardInnerContent = `
                <div class="flex-grow">
                    <h3 class="text-2xl font-bold">${post.title}</h3>
                    <p class="text-gray-400 mt-2 text-sm">${post.summary}</p>
                </div>
                <span class="mt-6 self-end font-semibold ${isUpcoming ? 'text-yellow-400' : 'text-white'}">
                    ${isUpcoming ? 'Coming Soon' : 'read now &rarr;'}
                </span>
            `;

            if (isUpcoming) {
                cardElement = document.createElement('div');
                cardElement.className = `bg-gray-900 text-white rounded-xl p-8 flex flex-col h-full opacity-50 cursor-not-allowed`;
            } else {
                cardElement = document.createElement('a');
                cardElement.href = `https://blog.edckprcas.co.in/week-${weekNumber}`;
                cardElement.target = "_blank"; // Open in a new tab
                cardElement.rel = "noopener noreferrer";
                cardElement.className = `bg-gray-900 text-white rounded-xl p-8 flex flex-col h-full hover:scale-105 transition-transform duration-300 cursor-pointer`;
            }
            
            cardElement.innerHTML = cardInnerContent;
            cardsContainer.appendChild(cardElement);
        });

    </script>
</body>
</html>
