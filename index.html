<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDC KPRCAS | Blog Series</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* ===== Dynamic Background Gradient Animation ===== */
    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(270deg, #e0f2ff, #f0f9ff, #dbeafe, #bfdbfe);
      background-size: 600% 600%;
      animation: gradientShift 12s ease infinite;
      z-index: -2;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== Floating Particles ===== */
    .particle {
      position: fixed;
      width: 8px;
      height: 8px;
      background: rgba(59, 130, 246, 0.2);
      border-radius: 50%;
      animation: floatUp 10s linear infinite;
      z-index: -1;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0.5; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* ===== Blog Card Hover Animation ===== */
    .blog-card {
      transition: all 0.3s ease;
    }
    .blog-card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.1);
    }

    /* ===== Fade-In Effect ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.8s ease-in-out;
    }
  </style>
</head>
<body class="relative text-gray-800 min-h-screen">

<!-- Dynamic Animated Background -->
<div class="animated-bg"></div>

<!-- Floating particles -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    for (let i = 0; i < 25; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      particle.style.left = Math.random() * 100 + 'vw';
      particle.style.animationDuration = (8 + Math.random() * 8) + 's';
      particle.style.width = particle.style.height = (4 + Math.random() * 6) + 'px';
      document.body.appendChild(particle);
    }
  });
</script>

<!-- Content -->
<div class="container mx-auto px-4 py-12 relative z-10">
  <!-- Header -->
  <header class="text-center mb-14 fade-in">
    <h1 class="text-4xl md:text-5xl font-extrabold text-blue-800">EDC KPRCAS</h1>
    <p class="text-lg text-blue-500 mt-2 font-medium">The Founder's Journey — Blog Series</p>
    <div class="w-24 h-1 bg-blue-600 mx-auto mt-3 rounded-full"></div>
  </header>

  <!-- Blog Cards Grid -->
  <div id="blog-cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

  <!-- Footer -->
  <footer class="mt-16 pt-6 border-t border-blue-100 text-center text-sm text-gray-600">
    &copy; 2025 <span class="font-semibold text-blue-700">EDC KPRCAS</span>. All Rights Reserved.
  </footer>
</div>

<script>
  const blogPosts = [
    { title: "Week 1: Vision and Foundation", date: "August 15, 2025", summary: "Discover how the EDC serves as a transformative platform to shape the futures of students." },
    { title: "Week 2: From Job Seeker to Job Creator", date: "August 22, 2025", summary: "Learn about the EDC's key role in transforming job seekers into visionary job creators." },
    { title: "Week 3: Cultivating Studentpreneurs", date: "August 29, 2025", summary: "Explore how the EDC fosters studentpreneurs, turning campuses into hubs of innovation." },
    { title: "Week 4: Impact on Business Development", date: "September 5, 2025", summary: "Understand the EDC's significant impact on business development and early-stage startups." },
    { title: "Week 5: The Evolution from Club to Cell", date: "September 12, 2025", summary: "Trace the growth of the EDC from an informal club to a structured, institutional cell." },
    { title: "Week 6: A Launchpad for Ventures", date: "September 19, 2025", summary: "See how the EDC provides a complete ecosystem to launch student business ventures." },
    { title: "Week 7: Gateway to the Startup Ecosystem", date: "September 26, 2025", summary: "Learn how the EDC connects students with the modern and sustainable startup world." },
    { title: "Week 8: From Pitching to Profit", date: "October 3, 2025", summary: "Follow the journey from pitching an idea to growing it into a profitable initiative with EDC's help." },
    { title: "Week 9: Why Your College Needs an EDC", date: "October 10, 2025", summary: "Understand the critical gap an EDC fills that a traditional academic curriculum cannot." },
    { title: "Week 10: Kickstart Your Career", date: "October 17, 2025", summary: "Discover how the EDC acts as the ultimate bridge between academic life and professional opportunities." }
  ];

  const cardsContainer = document.getElementById('blog-cards-grid');
  const today = new Date();

  blogPosts.forEach((post, index) => {
    const postDate = new Date(post.date);
    const isUpcoming = postDate > today;
    const weekNumber = index + 1;

    let cardHTML = `
        <div class="fade-in blog-card bg-white border border-blue-100 rounded-2xl p-6 flex flex-col h-full ${isUpcoming ? 'opacity-70 cursor-not-allowed' : 'hover:bg-blue-50 cursor-pointer'}">
          <div class="flex-grow">
            <h3 class="text-xl font-semibold text-blue-900">${post.title}</h3>
            <p class="text-gray-600 mt-2 text-sm leading-relaxed">${post.summary}</p>
          </div>
          <div class="mt-6 flex items-center justify-between">
            <span class="text-xs font-medium text-blue-400">${post.date}</span>
            <span class="font-semibold text-sm ${isUpcoming ? 'text-blue-400' : 'text-blue-700'}">
              ${isUpcoming ? 'Coming Soon' : 'Read Now →'}
            </span>
          </div>
        </div>
      `;

    const wrapper = document.createElement(isUpcoming ? 'div' : 'a');
    if (!isUpcoming) {
      wrapper.href = `https://blog.edckprcas.co.in/week-${weekNumber}`;
      wrapper.target = "_blank";
      wrapper.rel = "noopener noreferrer";
    }
    wrapper.innerHTML = cardHTML;
    cardsContainer.appendChild(wrapper);
  });
</script>
</body>
</html>
